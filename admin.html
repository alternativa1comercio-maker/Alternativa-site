<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel Admin — Alternativa Auto Peças</title>
  <link rel="stylesheet" href="admin.css">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="admin-wrap">
    <header class="admin-header">
      <h1>Alternativa — Painel de Produtos</h1>
      <div id="userActions" class="user-actions" style="display:none;">
        <span id="userEmail"></span>
        <button id="btnLogout">Sair</button>
      </div>
    </header>

    <main class="admin-main">
      <section id="authSection" class="card">
        <h2>Login</h2>
        <p>Use o e-mail cadastrado no Supabase Auth.</p>
        <input id="loginEmail" type="email" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Senha" />
        <div class="row">
          <button id="btnLogin">Entrar</button>
        </div>
        <div id="authMsg" class="msg"></div>
      </section>

      <section id="panelSection" class="card" style="display:none;">
        <h2>Gerenciar Produtos</h2>

        <form id="productForm" class="form-grid">
          <input type="hidden" id="productId" value="">

          <label>Nome *</label>
          <input id="nome" required placeholder="Ex: Motor Parcial 1.0">

          <label>Descrição *</label>
          <textarea id="descricao" rows="3" required placeholder="Detalhes da peça..."></textarea>

          <label>Tipo de Preço</label>
          <select id="preco_tipo">
            <option value="valor">Valor Fixo</option>
            <option value="combinar">A Combinar</option>
          </select>

          <label>Valor (R$)</label>
          <input id="preco" type="number" step="0.01" min="0" placeholder="0.00">

          <label>Frete</label>
          <select id="frete_tipo">
            <option value="gratis">Grátis</option>
            <option value="combinar">A Combinar</option>
            <option value="valor">Valor Fixo</option>
          </select>

          <label>Valor Frete (R$)</label>
          <input id="frete_valor" type="number" step="0.01" min="0" placeholder="0.00">

          <label>Imagem (arquivo)</label>
          <input id="imagem_file" type="file" accept="image/*">

          <label>Status</label>
          <select id="status">
            <option value="estoque">Em Estoque</option>
            <option value="vendido">Vendido</option>
            <option value="reservado">Reservado</option>
          </select>

          <div class="form-actions">
            <button type="button" id="btnSave">💾 Salvar</button>
            <button type="button" id="btnCancel">❌ Cancelar</button>
          </div>
        </form>

        <hr>

        <h3>Produtos Cadastrados</h3>
        <div id="produtosList" class="prod-list"></div>

      </section>
    </main>

    <footer class="admin-footer">
      <small>Alternativa Auto Peças — Painel Admin</small>
    </footer>
  </div>
